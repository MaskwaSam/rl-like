server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints every file under assets/, so browsers can keep them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page and the relay credentials must never go stale: a redeploy or new TURN
    # credentials should reach players on their next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /turn.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
