<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL-like</title>
    <style>
      :root {
        --bg: #05080f;
        --panel: rgba(14, 20, 34, .92);
        --panel-border: rgba(120, 160, 230, .18);
        --text: #e8eef5;
        --muted: rgba(232, 238, 245, .62);
        --accent: #ffb347;
        --accent-2: #4aa3ff;
        --focus: #ffd166;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
      #hud[hidden] { display: none; }
      #score { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 700; letter-spacing: 1px; }
      #score .blue { color: #4aa3ff; } #score .orange { color: #ff9a3c; }
      #clock { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; opacity: .9; }
      #clock.overtime { color: #ffd166; }
      #clock[hidden] { display: none; }
      #ping { opacity: .75; }
      #ping[hidden] { display: none; }
      #ping.bad { color: #ff6b6b; opacity: 1; }
      #banner .sub { font-size: 20px; font-weight: 600; opacity: .85; margin-top: 6px; }
      #banner.countdown .title { font-size: 120px; line-height: 1; }
      #topright { position: absolute; top: 12px; right: 16px; display: flex; gap: 10px; align-items: baseline; font-size: 13px; font-variant-numeric: tabular-nums; }
      #fps { opacity: .7; }
      #banner { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
      #banner .title { font-size: 56px; font-weight: 800; }
      #banner .goalSpeed { font-size: 22px; font-weight: 600; opacity: .9; margin-top: 4px; }

      #bottomleft { position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
      #camMode { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.35); opacity: .55; }
      #camMode.on { opacity: 1; border-color: #7CFC9A; color: #7CFC9A; }
      #controller { font-size: 12px; opacity: .75; }
      #controller .ok { color: #7CFC9A; } #controller .warn { color: #ffd166; }

      #bottomright { position: absolute; right: 22px; bottom: 16px; display: flex; align-items: flex-end; gap: 18px; }
      #speed { text-align: right; font-variant-numeric: tabular-nums; margin-bottom: 14px; min-width: 110px; }
      #speed .value { font-size: 34px; font-weight: 800; line-height: 1; transition: font-size .12s ease-out; }
      #speed .unit { font-size: 12px; opacity: .7; letter-spacing: 1px; }
      #speed.max .value { color: #ff4d4d; font-size: 48px; animation: pulse .5s ease-in-out infinite alternate; }
      #speed.max .unit { color: #ff4d4d; opacity: 1; }
      @keyframes pulse { from { text-shadow: 0 0 4px rgba(255,77,77,.4); } to { text-shadow: 0 0 16px rgba(255,77,77,.95); } }
      #boostGauge { width: 132px; height: 132px; position: relative; }
      #boostGauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      #boostGauge .track { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 12; }
      #boostGauge .fill { fill: none; stroke: #ffb347; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .06s linear; }
      #boostGauge .fill.boosting { stroke: #ffd98a; }
      #boostGauge .fill.empty { stroke: #ff6b6b; }
      #boostValue { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
      #boostLabel { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-size: 11px; letter-spacing: 2px; opacity: .7; }

      /* ---------------- Menu ---------------- */
      .menu {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; overflow: auto;
        background:
          radial-gradient(1200px 600px at 20% -10%, rgba(74, 163, 255, .18), transparent 60%),
          radial-gradient(900px 500px at 100% 110%, rgba(255, 154, 60, .16), transparent 60%),
          linear-gradient(180deg, #070b14 0%, #05080f 100%);
      }
      .menu::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
        background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, rgba(0,0,0,.9), transparent 75%);
      }
      .menu[hidden] { display: none; }
      /* Garage: see-through, panel at the bottom, so the turning car shows above it. */
      .menu.garage { background: none; align-items: flex-end; padding-bottom: 6vh; }
      .menu.garage::before { display: none; }
      .menu-panel.garage-panel { min-width: 520px; }
      .build-stamp {
        position: absolute; right: 16px; bottom: 12px; font-size: 11.5px; letter-spacing: .3px;
        color: rgba(232,238,245,.38); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        user-select: text; -webkit-user-select: text; pointer-events: auto;
      }
      .menu-panel {
        position: relative; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 32px 36px; min-width: 380px;
        box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(6px);
        animation: panelIn .18s ease-out;
      }
      @keyframes panelIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
      .menu-panel.wide { min-width: 700px; max-width: 860px; }
      .menu-panel[hidden] { display: none; }
      .menu-title { margin: 0 0 4px; font-size: 40px; letter-spacing: 1px; font-weight: 800; line-height: 1; }
      .menu-title .accent { color: var(--accent); }
      .menu-subtitle { margin: -2px 0 14px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
      h2.menu-title { font-size: 24px; letter-spacing: .5px; margin-bottom: 8px; }
      .menu-hint { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); max-width: 560px; line-height: 1.45; }
      .menu-hint kbd, .menu-hint .btn-glyph { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07); font-size: 11px; text-align: center; margin: 0 1px; }
      .menu-button {
        font: inherit; font-size: 17px; font-weight: 600; padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(120,160,230,.22);
        background: linear-gradient(180deg, rgba(32, 46, 74, .95), rgba(22, 32, 54, .95)); color: var(--text); cursor: pointer; text-align: left;
        transition: transform .08s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
      }
      .menu-button:hover { border-color: rgba(120,160,230,.5); transform: translateX(2px); }
      .menu-button.primary { background: linear-gradient(180deg, #ffc46b, #f59b1d); color: #1a1206; border-color: rgba(255,200,120,.6); }
      .menu-button.primary:hover { filter: brightness(1.05); }
      .menu-button.danger { border-color: rgba(255,107,107,.35); color: #ffb3b3; }
      .menu-button:disabled { opacity: .5; cursor: default; }
      .menu-stack { display: flex; flex-direction: column; gap: 12px; }
      .menu-row.wrap { flex-wrap: wrap; }
      .menu-row.wrap .menu-button { flex: 1 1 180px; }
      .field-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; }
      .field-row.focused { outline: none; box-shadow: none; border-color: rgba(255, 209, 102, .45); background: rgba(255, 209, 102, .06); }
      .field-label { font-size: 13px; color: var(--muted); min-width: 90px; text-transform: uppercase; letter-spacing: 1px; }
      .menu-input {
        font: inherit; font-size: 17px; font-weight: 600; flex: 1; padding: 11px 14px; border-radius: 10px; color: var(--text);
        border: 1px solid rgba(120,160,230,.3); background: rgba(8, 12, 22, .9); outline: none; min-width: 0;
      }
      .menu-input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(255, 209, 102, .15); }
      .menu-input.code { letter-spacing: 6px; text-transform: uppercase; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .menu-status { margin: 4px 0 0; min-height: 18px; font-size: 13px; color: #ffd166; }
      .menu-button.subtle { font-size: 14px; padding: 10px 14px; opacity: .85; }
      .net-report { margin-top: 4px; padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(120,160,230,.2); font-size: 13px; line-height: 1.6; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
      .net-report[hidden] { display: none; }
      .menu-status.busy { color: var(--muted); }
      .menu-title .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 6px; }
      .lobby { display: flex; flex-direction: column; gap: 14px; }
      .lobby-status { font-size: 13px; color: var(--muted); }
      .lobby-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .lobby-team { border-radius: 12px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); min-height: 120px; }
      .lobby-team.blue { border-color: rgba(74,163,255,.35); } .lobby-team.orange { border-color: rgba(255,154,60,.35); }
      .lobby-team-title { font-size: 12px; letter-spacing: 2px; font-weight: 700; margin-bottom: 8px; }
      .lobby-team.blue .lobby-team-title { color: #4aa3ff; } .lobby-team.orange .lobby-team-title { color: #ff9a3c; }
      .lobby-player { padding: 6px 8px; border-radius: 6px; font-size: 15px; }
      .lobby-player.me { background: rgba(255,255,255,.07); font-weight: 600; }
      .lobby-player.empty { color: var(--muted); }
      .lobby-info { flex: 1 1 180px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
      .focused { outline: 2px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 4px rgba(255, 209, 102, .12); }
      .menu-row { display: flex; gap: 10px; margin-top: 10px; }
      .menu-row .menu-button { flex: 1; text-align: center; font-size: 15px; padding: 11px 14px; }
      .bind-table { display: flex; flex-direction: column; gap: 6px; }
      .bind-row { display: grid; grid-template-columns: 220px 150px 150px; gap: 8px; align-items: center; font-size: 14px; padding: 2px 4px; }
      .bind-row:nth-child(even):not(.bind-head) { background: rgba(255,255,255,.025); border-radius: 6px; }
      .bind-head { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; }
      .bind-cell { font-size: 14px; padding: 8px 10px; text-align: center; font-weight: 500; }
      .bind-cell.capturing { background: #5a4a10; border-color: #ffd166; color: #fff; }
      .slider-list { display: flex; flex-direction: column; gap: 6px; }
      .slider-row { display: grid; grid-template-columns: 270px 40px 90px 40px 1fr; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; }
      .slider-row.focused { background: rgba(255, 209, 102, .07); border-color: rgba(255, 209, 102, .35); outline: none; box-shadow: none; }
      .slider-title { font-weight: 600; }
      .slider-desc { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
      .slider-value { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
      .menu-button.adj { padding: 6px 0; text-align: center; font-size: 16px; line-height: 1; }
      .slider-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      .slider-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden>
      <div id="score"><span class="blue">BLUE 0</span> &nbsp;–&nbsp; <span class="orange">0 ORANGE</span></div>
      <div id="clock" hidden>5:00</div>
      <div id="topright"><div id="ping" hidden>— ms</div><div id="fps">— fps</div></div>
      <div id="banner"><div class="title"></div><div class="goalSpeed"></div><div class="sub"></div></div>
      <div id="bottomleft">
        <div id="camMode" class="on">BALL CAM</div>
        <div id="controller">Loading…</div>
      </div>
      <div id="bottomright">
        <div id="speed"><div class="value">0</div><div class="unit">KM/H</div></div>
        <div id="boostGauge">
          <svg viewBox="0 0 132 132">
            <circle class="track" cx="66" cy="66" r="56" />
            <circle id="boostFill" class="fill" cx="66" cy="66" r="56" />
          </svg>
          <div id="boostValue">33</div>
          <div id="boostLabel">BOOST</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
