name: car-soccer
services:
  car-soccer:
    image: ${CAR_SOCCER_IMAGE:?Set the immutable release image}
    container_name: car-soccer
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks:
      edge:
        aliases: [car-soccer]
networks:
  edge:
    name: car_soccer_edge
    internal: true
