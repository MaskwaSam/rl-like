# Build the game and run its regression suites on pushes to main.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build
      - name: Build server
        run: npm run server:build
      - name: Run retry regression
        run: npm run test:retry
      - name: Run session regression
        run: npm run test:sessions
      - name: Run transport regression
        run: npm run test:transport
